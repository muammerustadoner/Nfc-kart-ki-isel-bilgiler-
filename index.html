<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temassız Girişim - Zilan Ustundağ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F7F6F2; color: #1C1B1A; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-stone-300 selection:text-stone-900">

    <div class="w-full max-w-md mx-auto">
        
        <!-- 1. OLUŞTURUCU GÖRÜNÜMÜ (Link Oluşturma Paneli) -->
        <div id="generatorView" class="hidden bg-white border border-stone-200/80 rounded-3xl p-6 shadow-2xl shadow-stone-300/40">
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold tracking-tight text-stone-900">NFC Link Oluşturucu</h1>
                <p class="text-xs text-stone-500 mt-1">Müşterilerinizin göreceği IBAN ve ödeme bilgilerini hazırlayın.</p>
            </div>

            <form id="ibanForm" class="space-y-4" onsubmit="generateLink(event)">
                <!-- Alıcı Adı -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">Alıcı Adı Soyadı / Unvanı</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-stone-400 pointer-events-none">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="nameInput" required placeholder="Örn: Zilan Ustundağ" class="w-full bg-stone-50 border border-stone-200 rounded-xl py-3 pl-10 pr-4 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-stone-500 focus:ring-1 focus:ring-stone-500 transition-all">
                    </div>
                </div>

                <!-- IBAN Numarası -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">IBAN Numarası</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-stone-500 font-bold text-sm pointer-events-none">TR</span>
                        <input type="text" id="ibanInput" required maxlength="32" placeholder="00 0000 0000 0000 0000 0000" class="w-full bg-stone-50 border border-stone-200 rounded-xl py-3 pl-11 pr-4 text-sm text-stone-900 placeholder-stone-400 font-mono tracking-wider focus:outline-none focus:border-stone-500 focus:ring-1 focus:ring-stone-500 transition-all" oninput="formatIbanInput(this)">
                    </div>
                    <p class="text-[11px] text-stone-400 mt-1">Sadece 24 haneli rakamları giriniz (TR otomatik eklenir).</p>
                </div>

                <!-- Gönder Butonu -->
                <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-stone-900/10 transition-all active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2 text-sm mt-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    NFC Linki Oluştur
                </button>
            </form>

            <!-- Sonuç Alanı -->
            <div id="resultBox" class="hidden mt-6 pt-6 border-t border-stone-200 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">Özel NFC Kart Linkiniz</label>
                    <div class="flex gap-2">
                        <input type="text" id="generatedLink" readonly class="w-full bg-stone-100 border border-stone-200 rounded-xl py-2.5 px-3 text-xs text-stone-700 font-mono select-all focus:outline-none">
                        <button onclick="copyGeneratedLink()" class="bg-stone-200 hover:bg-stone-300 text-stone-800 px-4 rounded-xl text-xs font-medium transition-colors shrink-0 cursor-pointer">Kopyala</button>
                    </div>
                </div>

                <div class="flex flex-col items-center justify-center bg-stone-50 border border-stone-200 p-4 rounded-2xl">
                    <div id="qrcode" class="mb-2"></div>
                    <span class="text-[11px] text-stone-600 font-medium">Bu QR Kodu da Test Edebilirsiniz</span>
                </div>

                <button onclick="resetGenerator()" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-700 py-2.5 rounded-xl text-xs font-medium transition-colors cursor-pointer">
                    Yeni Bilgi Gir
                </button>
            </div>
        </div>


        <!-- 2. MÜŞTERİ / KART GÖRÜNÜMÜ (Lüks Krem - Gri Tasarım) -->
        <div id="customerView" class="hidden space-y-5">
            
            <!-- Başlık Alanı (Görsel ve Logo Yok, İstenen Metinler) -->
            <div class="text-center space-y-1.5 pt-2">
                <h1 class="text-2xl font-bold tracking-wider text-stone-900">TEMASSIZ GİRİŞİM</h1>
                <p class="text-xs font-medium text-stone-500 tracking-wide">Hizmet veren: <span class="text-stone-800 font-semibold">Zilan Ustundağ</span></p>
            </div>

            <!-- İşlem Butonları (Örnek Tasarımdaki Düzen) -->
            <div class="space-y-3">
                <!-- Rehbere Kaydet Butonu -->
                <button onclick="saveContact()" class="w-full bg-white hover:bg-stone-50 border border-stone-200/90 rounded-2xl p-3.5 shadow-sm transition-all flex items-center justify-center gap-2 text-stone-800 font-semibold text-sm cursor-pointer active:scale-98">
                    <svg class="w-5 h-5 text-stone-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                    Rehbere Kaydet
                </button>

                <!-- İkili Butonlar (WhatsApp & Ara) -->
                <div class="grid grid-cols-2 gap-3">
                    <a href="https://wa.me/" target="_blank" class="bg-white hover:bg-stone-50 border border-stone-200/90 rounded-2xl p-3.5 shadow-sm transition-all flex items-center justify-center gap-2 text-stone-800 font-medium text-xs">
                        <svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                        WhatsApp
                    </a>
                    <a href="tel:" id="callBtn" class="bg-white hover:bg-stone-50 border border-stone-200/90 rounded-2xl p-3.5 shadow-sm transition-all flex items-center justify-center gap-2 text-stone-800 font-medium text-xs">
                        <svg class="w-4 h-4 text-stone-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        Ara
                    </a>
                </div>
            </div>

            <!-- IBAN Kart Kutusu (Lüks Krem-Gri Tonlar) -->
            <div class="bg-white border border-stone-200/90 rounded-3xl p-5 shadow-xl shadow-stone-300/30 space-y-4">
                
                <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Banka Hesabı (IBAN)</span>
                    <span id="viewName" class="text-xs font-semibold text-stone-800">--</span>
                </div>

                <!-- IBAN Numarası ve Kopyala Butonu -->
                <div class="space-y-2">
                    <div id="viewIban" class="text-sm font-mono font-bold text-stone-900 tracking-wider">--</div>
                    <button onclick="copyToClipboard('viewIban', this)" class="w-full bg-stone-900 hover:bg-stone-800 text-white py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-98 cursor-pointer flex items-center justify-center gap-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Kopyala
                    </button>
                </div>

            </div>

        </div>

    </div>

    <script>
        // IBAN Giriş Formatlama
        function formatIbanInput(input) {
            let value = input.value.replace(/\D/g, '').substring(0, 24);
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += value[i];
            }
            input.value = formatted;
        }

        // URL Parametrelerini Kontrol Et
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const iban = urlParams.get('iban');

            if (name && iban) {
                // Müşteri Görünümü
                document.getElementById('customerView').classList.remove('hidden');
                document.getElementById('viewName').innerText = decodeURIComponent(name);
                document.getElementById('viewIban').innerText = decodeURIComponent(iban);
            } else {
                // Oluşturucu Görünümü
                document.getElementById('generatorView').classList.remove('hidden');
            }
        });

        // Link Üretme Fonksiyonu
        function generateLink(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput').value.trim();
            const ibanRaw = document.getElementById('ibanInput').value.replace(/\s+/g, '');

            if (ibanRaw.length !== 24) {
                alert('Lütfen 24 haneli geçerli bir IBAN numarası giriniz.');
                return;
            }

            const ibanFormatted = 'TR' + ibanRaw;
            const baseUrl = window.location.origin + window.location.pathname;
            const finalLink = `${baseUrl}?name=${encodeURIComponent(name)}&iban=${encodeURIComponent(ibanFormatted)}`;

            document.getElementById('generatedLink').value = finalLink;
            document.getElementById('resultBox').classList.remove('hidden');

            // QR Kod Oluştur
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: finalLink,
                width: 140,
                height: 140,
                colorDark: "#1c1b1a",
                colorLight: "#f7f6f2",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Link Kopyalama
        function copyGeneratedLink() {
            const copyText = document.getElementById('generatedLink');
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value).then(() => {
                alert('Link kopyalandı! Bu linki NFC kartınıza yazabilirsiniz.');
            });
        }

        // Panoya Kopyala (IBAN ve İsim İçin)
        function copyToClipboard(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showCopiedFeedback(btnElement);
                }).catch(() => {
                    fallbackCopyText(textToCopy, btnElement);
                });
            } else {
                fallbackCopyText(textToCopy, btnElement);
            }
        }

        function fallbackCopyText(text, btnElement) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback(btnElement);
            } catch (err) {
                alert('Kopyalanamadı, lütfen manuel kopyalayın.');
            }
            document.body.removeChild(textArea);
        }

        function showCopiedFeedback(btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Kopyalandı!`;
            btn.classList.add('bg-stone-700');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-stone-700');
            }, 2000);
        }

        // Rehbere Kaydet (vCard İndirme)
        function saveContact() {
            const name = document.getElementById('viewName').innerText;
            const iban = document.getElementById('viewIban').innerText;
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nNOTE:IBAN: ${iban}\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name.replace(/\s+/g, '_')}_TemassizGirisim.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Yeni Bilgi Girişi İçin Sıfırla
        function resetGenerator() {
            document.getElementById('ibanForm').reset();
            document.getElementById('resultBox').classList.add('hidden');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
